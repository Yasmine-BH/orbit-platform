name: CI - interns-api

on:
  push:
    branches: [main]
    paths:
      - 'services/interns-api/**'
      - 'charts/interns-api/**'

  pull_request:
    paths:
      - 'services/interns-api/**'

env:
  IMAGE: ghcr.io/${{ github.repository }}/interns-api

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test
        working-directory: services/interns-api

  build-and-publish:
    needs: test
    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Convert repository name to lowercase
        run: |
          echo "REPO_LOWER=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: services/interns-api
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/interns-api:${{ github.sha }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/interns-api:${{ github.sha }}
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

      - name: Update image tag in Helm values
        run: |
          sed -i 's|tag: .*|tag: "${{ github.sha }}"|' charts/interns-api/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add charts/interns-api/values.yaml
          git commit -m "ci: bump interns-api image to ${{ github.sha }} [skip ci]" || true
          git push
