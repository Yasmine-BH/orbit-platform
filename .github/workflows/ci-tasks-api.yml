name: CI - tasks-api
on:
  push:
    branches: [main]
    paths: ['services/tasks-api/**']
  pull_request:
    paths: ['services/tasks-api/**']

env:
  IMAGE: ghcr.io/${{ github.repository }}/tasks-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: services/tasks-api
      - run: pytest
        working-directory: services/tasks-api

  build-and-publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Convert repo to lowercase
        run: echo "REPO_LOWER=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/tasks-api
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}/tasks-api:${{ github.sha }}
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ env.REPO_LOWER }}/tasks-api:${{ github.sha }}
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
      - name: Update image tag in chart
        run: |
          sed -i 's|tag: .*|tag: "${{ github.sha }}"|' charts/tasks-api/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "ci: bump tasks-api image to ${{ github.sha }} [skip ci]" || true
          git push
