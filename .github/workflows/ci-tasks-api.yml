name: CI - tasks-api

on:
  push:
    branches: [main]
    paths: ['services/tasks-api/**', 'charts/tasks-api/**']
  pull_request:
    paths: ['services/tasks-api/**']

env:
  IMAGE: ghcr.io/${{ github.repository | lower }}/tasks-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt -r requirements-dev.txt
      working-directory: services/tasks-api
    - run: pytest
      working-directory: services/tasks-api

  build-and-publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: write
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: services/tasks-api
        push: true
        tags: ${{ env.IMAGE }}:${{ github.sha }}
    - name: Update image tag in chart
      run: |
        sed -i 's|tag: .*|tag: "${{ github.sha }}"|' charts/tasks-api/values.yaml
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -am "ci: bump tasks-api image to ${{ github.sha }} [skip ci]" || true
        git push
