replicaCount: 1

image:
  repository: ghcr.io/yasmine-bh/orbit-platform/tasks-api
  pullPolicy: IfNotPresent
  tag: "213b1fbd71a3eb54903e959320a8a6a7f2523a5d"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

config:
  serverPort: "8000"

database:
  host: postgresql
  port: 5432
  name: orbit
  user: orbit
  existingSecret: db-credentials

internsApi:
  url: "http://interns-api:8080"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /health
  initialDelaySeconds: 10
  periodSeconds: 5

configMap:
  enabled: true

ingress:
  enabled: true
  className: traefik
  host: tasks.orbit.local
  path: /api/tasks

ingress:
  enabled: true
  className: traefik
  host: tasks.orbit.local
  path: /api/tasks
  pathType: Prefix
