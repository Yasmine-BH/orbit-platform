replicaCount: 1

image:
  repository: ghcr.io/yasmine-bh/orbit-platform/interns-api
  pullPolicy: IfNotPresent
  tag: "a18f387af6c134d31bea34d0cb3443f6bf6ba895"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

config:
  serverPort: "8080"
  jpaShowSql: "false"
  jpaDdlAuto: "update"

database:
  host: postgresql
  port: 5432
  name: orbit
  user: orbit
  existingSecret: db-credentials

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

livenessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /actuator/health
  initialDelaySeconds: 10
  periodSeconds: 5

configMap:
  enabled: true

ingress:
  enabled: true
  className: traefik
  host: interns.orbit.local
  path: /api/interns

ingress:
  enabled: true
  className: traefik
  host: interns.orbit.local
  path: /api/interns
  pathType: Prefix
