server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: interns-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orbit}
    username: ${DB_USER:orbit}
    password: ${DB_PASSWORD:orbit}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # never rely on Hibernate to shape prod schema; use validate once a migration
      # tool is introduced. ddl-auto=update is fine for this project's scope.
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

# Actuator: liveness/readiness probe groups are what Kubernetes will hit later
management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

# OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Base URL of tasks-api, used only if this service ever needs to call back --
# kept here to demonstrate config-from-environment even though interns-api
# does not call tasks-api in the current design.
services:
  tasks-api:
    base-url: ${TASKS_API_URL:http://localhost:8000}
